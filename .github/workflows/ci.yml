name: CI

on:
  pull_request:
    branches: [ "main" ]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      export_service: ${{ steps.filter.outputs.export_service }}
      ocr_service: ${{ steps.filter.outputs.ocr_service }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend-go/**'
            frontend:
              - 'frontend/**'
            export_service:
              - 'export-service/**'
            ocr_service:
              - 'ocr-service/**'

  backend-go:
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.x' # Fallback to latest stable
          cache-dependency-path: backend-go/go.sum
      - name: Build
        run: cd backend-go && go build -v ./cmd/api
      - name: Test
        run: cd backend-go && go test -v ./...

  frontend:
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: cd frontend && npm ci
      - name: Lint
        run: cd frontend && npm run lint
      - name: Build
        run: cd frontend && npm run build
      - name: Test
        run: cd frontend && npm run test --if-present

  export-service:
    needs: changes
    if: ${{ needs.changes.outputs.export_service == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: export-service/package-lock.json
      - name: Install dependencies
        run: cd export-service && npm ci
      - name: Build
        run: cd export-service && npm run build
      - name: Test
        run: cd export-service && npm run test --if-present

  ocr-service:
    needs: changes
    if: ${{ needs.changes.outputs.ocr_service == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          cd ocr-service
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Test with pytest
        run: cd ocr-service && pytest
