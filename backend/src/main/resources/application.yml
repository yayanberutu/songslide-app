spring:
  application:
    name: songslide-backend
  profiles:
    default: local

server:
  port: ${BACKEND_PORT:8080}
  servlet:
    context-path: /api

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized

songslide:
  export-service:
    url: ${EXPORT_SERVICE_URL:http://localhost:3002}
  source-images:
    max-size-mb: ${MAX_SOURCE_IMAGE_SIZE_MB:10}
  storage:
    local:
      root: ${STORAGE_ROOT:./.local-storage}
